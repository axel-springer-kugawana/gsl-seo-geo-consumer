components:
  parameters:
      traceparentHeader:
        name: traceparent
        in: header
        required: false
        description: Identifies the incoming request in the tracing system
        example: "00-0af7651916cd43dd8448eb211c80319c-b9c7c989f97918e1-01"
        schema:
          type: string
      userAgentHeader:
        required: true
        in: header
        name: User-Agent
        description: |
          Characteristic string that identifies the application, operating system, vendor, and version of the requesting user agent.

          Syntax : `User-Agent: <crm-software-name>/<crm-software-version> <tool-name>/<tool-version> <operating-system>/<operating-system-version>`

          All subset parts of this string do not allow the following characters : `/` and ` ` (whitespace)


        example: "MyAwesomeSoft/1.0.0 curl/7.52.1 debian/9~1.gbpf8534c"
        schema:
          type: string
          pattern: ^[^\/\s]+\/[^\/\s]+\s{1}[^\/\s]+\/[^\/\s]+\s{1}[^\/\s]+\/[^\/\s]+$
  headers:
    traceparent:
      description: Identifies the request in the tracing system
      example: 00-0af7651916cd43dd8448eb211c80319c-b9c7c989f97918e1-01
      schema:
        type: string
        pattern: "^([0-9a-f]{2})-([0-9a-f]{32})-([0-9a-f]{16})-([0-9a-f]{2})$"
  schemas:
    AvivClassified:
      type: object
      required:
        - portals
        - data
      properties:
        portals:
          description: |
            Portals where the classified has to be published on.
            * `SL` - The SL portal. To be published on https://wwww.seloger.com
            * `BUCOM` - The BUCOM portal. To be published on https://bureaux-commerces.seloger.com
            * `LI` - The LI portal. To be published on https://logic-immo.com
            * `BD` - The BD portal. To be published on https://www.bellesdemeures.com
            * `LR` - The LR portal. To be published on https://www.lux-residence.com
          type: array
          maxItems: 5
          minItems: 0
          uniqueItems: true
          items:
            type: string
            enum: ["SL", "BUCOM", "BD", "LR", "LI"]
            minLength: 0
          example: ["SL", "LI"]
        data:
          $ref: '#/components/schemas/RealEstate'
        specific:
          $ref: '#/components/schemas/Specific'
      additionalProperties: false
    RealEstate:
      type: object
      required:
        - estateType
        - prices
        - location
        - metaData
        - distributionType
      additionalProperties: false
      properties:
        estateType:
          allOf:
            - $ref: "#/components/schemas/EstateType"
        estateSubType:
          description: subtypes to specify the selected estateType in detail
          type: object
          additionalProperties: false
          properties:
            house:
              type: string
              enum:
                - APARTMENT_HOUSE
                - BUNGALOW
                - CASTLE
                - MANOR_HOUSE
                - CHALET
                - FARMHOUSE
                - FINCA
                - GARDEN_HOUSE
                - GITE
                - LIVING_AND_COMMERCIAL
                - MULTI_FAMILY_HOUSE
                - MOUNTAIN_HUT
                - RESIDENTIAL_COMPLEX
                - RUSTICO
                - SEMIDETACHED_HOUSE
                - SINGLE_FAMILY_HOUSE
                - SPECIAL_REAL_ESTATE
                - TERRACE_HOUSE
                - CORNER_TERRACE_HOUSE
                - END_TERRACE_HOUSE
                - MID_TERRACE_HOUSE
                - TOWN_HOUSE
                - VILLA
              description: >-
                subtypes of a house to describe the selected estate type
                in detail. descriptions for the enums above:
                - APARTMENT_HOUSE: a building containing multiple apartments
                  with a common entrance and sometimes services
                - BUNGALOW: a house that usually has only one storey, sometimes
                  with an attic, with a flat or a low-pitched roof
                - CASTLE:  a historical massive and imposing building
                  usually fortified, built by the nobility, royalty or
                  by military orders.
                - MANOR_HOUSE: magnificent country house, often dating from
                  the late middle ages, in which the landed gentry used to live.
                - CHALET: a wooden house with a sloping roof and widely
                  overhanging eaves, common in Switzerland and other Alpine
                  regions in Europe.
                - FARMHOUSE: a house attached to a farm, especially the main
                  house in which the farmer lives.
                - FINCA: spanish-style country house with a large garden in
                  rural environment
                - GARDEN_HOUSE: a small dwelling usually built of wood located
                  in the garden of a large property or in garden allotments
                - GITE: a furnished holiday home in France that is available
                  for rent, especially in a rural environment.
                - LIVING_AND_COMMERCIAL: a building that contains units for
                  living and for commercial, eg apartments, shops, offices
                - MOUNTAIN_HUT: a building located high in the mountains,
                  usually accessible only by foot. When they are managed, they
                  provide food and shelter to mountaineers
                - MULTI_FAMILY_HOUSE: a single building that is set up to
                  accommodate more than one family living separately.
                - RESIDENTIAL_COMPLEX: a set of buildings containing multiple apartments
                  often with common services, shared garden, pool, playground
                - RUSTICO: originally a cottage or farm building traditionally
                  built with granite, typical for Ticino in Switzerland
                - SEMIDETACHED_HOUSE: a house that is joined to another similar
                  house on one side by a shared wall
                - SINGLE_FAMILY_HOUSE: a freestanding house, with one dwelling
                  unit for a person, couple or a family, set alone on its own
                  parcel of land
                - SPECIAL_REAL_ESTATE: a special kind of property that can not
                  be classified by another subtype, eg like a church
                - TERRACE_HOUSE: row of similar houses joined together
                  by their side walls; row houses
                  de: Achtung! entspricht nicht einem Terrassenhaus im Deutschen!
                - CORNER_TERRACE_HOUSE: is located at the corner or staggered
                  in a row of terrace houses; one side wall is shared with
                  another terrace house
                - END_TERRACE_HOUSE: is located at the end of a row of terrace
                  houses, one side wall is shared with another terrace house
                - MID_TERRACE_HOUSE: is located in the middle of a row of
                  terrace houses, both side walls are shared with another
                  terrace house each.
                - TOWN_HOUSE: a tall, narrow house generally having three or
                  more floors, usually in a row of similar houses which are
                  connected together, sometimes even by a common sidewall.
                - VILLA: a prestigious house, that is very spacious and may
                  include luxurious amenities such as a pool, etc.
              example: SINGLE_FAMILY_HOUSE
            apartment:
              type: string
              enum:
                - MULTI_STOREY
                - FLATSHARING_ROOM
                - LOFT
                - PENTHOUSE
                - STUDIO
                - TERRACE
                - UNFINISHED_ATTIC_SPACE
              description: |-
                subtypes of an apartment to describe the selected estate type
                in detail. descriptions for the enums above:
                - MULTI_STOREY: apartment that spreads over two, three or more
                  floors connected by an inner staircase, offered as
                  one property. a maisonette;
                - FLATSHARING_ROOM: single room within a flat or a house in the
                  context of shared living
                - LOFT: an industrial, warehouse, or commercial space converted
                  to an apartment
                - PENTHOUSE: an apartment on the highest floor of a building,
                  that is usually equipped with high standard.
                  Equivalent to the Swiss Attica.
                - STUDIO: a small flat in which the normal rooms (living room,
                  bedroom and kitchen) are combined into a single room
                - TERRACE: an apartment with a terrace and often an
                  adjoining garden
                - UNFINISHED_ATTIC_SPACE: large attic floor that can be
                  developed into an apartment
              example: LOFT
            plot:
              type: string
              enum:
                - LIVING
                - COMMERCIAL
                - INDUSTRY
                - AGRICULTURE_FORESTRY
                - MIXED
                - LEISURE_FACILITY
                - COMMERCIAL_PARC
                - SPECIAL_USE
                - LAKESIDE_PROPERTY
              description: |-
                subtypes of a plot to describe the selected estate type
                in detail.
                Descriptions for the enums above:
                - LIVING: only residential buildings may be built on that plot
                - COMMERCIAL: only for commercial use
                - INDUSTRY: only for industrial use
                - AGRICULTURE_FORESTRY: a plot intended for farming or forestry
                - MIXED: a plot for mixed usage
                - LEISURE_FACILITY: for leisure activities such as sports,
                  gardening, etc.
                - COMMERCIAL_PARC: a plot in a commercial park or a commercial
                  park itself
                - SPECIAL_USE: a plot for a separate or special use
                - LAKESIDE_PROPERTY: a plot that adjoins a lake or the sea
              example: COMMERCIAL
            office:
              type: string
              enum:
                - SINGLE_OFFICE
                - OFFICE_SPACE
                - OFFICE_BUILDING
                - OFFICE_CENTRE
                - OFFICE_STORAGE_BUILDING
                - MEDICAL
                - MEDICAL_FLOOR
                - MEDICAL_BUILDING
                - LIVING_AND_COMMERCIAL_BUILDING
                - ATELIER
                - COWORKING
                - OPEN_SPACE
                - SHARED_OFFICE
              description: |-
                subtypes of an office property to describe the selected
                estate type in detail.
                Descriptions for the enums above:
                - SINGLE_OFFICE: single office room
                - OFFICE_SPACE: an office for several workplaces, can consist
                  of several rooms
                - OFFICE_BUILDING: a building that contains different office
                  units
                - OFFICE_CENTRE: a larger building that contains different
                  office units, can also be made up of several buildings
                - OFFICE_STORAGE_BUILDING: combines an office building
                  and a warehouse
                - MEDICAL: medical practice sometimes already equipped with
                  medical apparatus
                - MEDICAL_FLOOR: more general a floor for a medical practice
                - MEDICAL_BUILDING: a building that contains different medical
                  units; medical centre
                - LIVING_AND_COMMERCIAL_BUILDING: a building that contains units
                  for living and for commercial, eg apartments, shops, offices
                - ATELIER: a workshop or studio, usually for artists or designer
                - COWORKING: an arrangement in which several workers from many
                  different companies share an office space; typically you do
                  not sit at the same desk every day and it is for short term
                - SHARED_OFFICE: an arrangement in which several companies
                  share an office space; typically you keep the same desk
                  and it is for long term
                - OPEN_SPACE: an open-plan office, without small rooms or
                  cubicles, usually has long rows of desks with little or
                  nothing dividing them.
              example: SINGLE_OFFICE
            trading:
              type: string
              enum:
                - STORE
                - SHOWROOM_SPACE
                - SHOPPING_CENTRE
                - KIOSK
                - SALES_AREA
              description: |-
                subtypes of a trading related property to describe the
                selected estate type in detail.
                Descriptions for the enums above:
                - STORE: shop or store for retail
                - SHOWROOM_SPACE: a room where merchandise is exhibited for
                  sale or where samples are displayed
                - SHOPPING_CENTRE: a building that contains several stores
                - KIOSK: a small building from which people can buy things such
                  as sandwiches or newspapers usually through an open window or
                  with a very small sellspace
                - SALES_AREA: a sellspace within another store
              example: STORE
            gastronomyHotel:
              type: string
              enum:
                - CAFE_BAR_PUB
                - RESTAURANT
                - CLUB_DISCOTHEQUE
                - HOTEL
                - APART_HOTEL
                - LEISURE
              description: >-
                subtypes of a gastronomy and hotel related property to describe
                the selected estate type in detail.
                Descriptions for the enums above:
                - CAFE_BAR_PUB: a property for a cafe, a bar, a pub or
                  something similar
                - RESTAURANT: a property for a restaurant
                - CLUB_DISCOTHEQUE: a property for club or a discotheque
                - HOTEL: a property for a hotel
                - APART_HOTEL: like a hotel, but instead of small rooms there
                  are apartments or studios
                - LEISURE: a property for leisure or entertainment with gastronomy
              example: RESTAURANT
            storageProduction:
              type: string
              enum:
                - WAREHOUSE_HALL
                - LOGISTICS_CENTER
                - PRODUCTION_HALL
                - GARAGE_REPAIR
                - OUTDOOR_SPACE
                - MISC_STORAGE
              description: |-
                subtypes of a storage and production related property to
                describe the selected estate type in detail.
                Descriptions for the enums above:
                - WAREHOUSE_HALL: a hall for industry and storage
                - LOGISTICS_CENTER:
                - PRODUCTION_HALL: an industrial hall where something is
                  produced
                - GARAGE_REPAIR: a repair shop or workshop
                - OUTDOOR_SPACE: an open space without a building or adjoining
                  to a building
                - MISC_STORAGE: a storage property that cannot be dedicated to
                  one of the other subTypes
              example: WAREHOUSE_HALL
            agricultureForestry:
              type: string
              enum:
                - FARM_RANCH
                - AGRICULTURE_COMPANY
                - GARDENING
                - FORESTRY
                - WINERY
                - HUNTING
                - FISHING
                - RIDING
                - MISC_AGRICULTURE
                - ORCHARD
              description: >-
                subtypes of a agriculture and forest related property to
                describe the selected estate type in detail.
                Descriptions for the enums above:
                - FARM_RANCH: land area with usually different buildings for
                  farming and livestock
                - AGRICULTURE_COMPANY: farm that runs agriculture as business
                - GARDENING: place where plants are tended and cultivated for
                  trading or selling
                - FORESTRY: management of forests, with planting, lumbering
                  and caring for the wood
                - WINERY: an establishment where wine is grown and made
                - HUNTING: a ground for hunting
                - FISHING: fishery and aquaculture
                - RIDING: riding stables; also includes a farm where horses are bred
                - MISC_AGRICULTURE: other properties regarding agriculture
                - ORCHARD: farm or plantation for fruits
              example: GARDENING
            parking:
              type: string
              enum:
                - OUTSIDE
                - STREET_PARKING
                - CARPORT
                - GARAGE
                - DOUBLE_GARAGE
                - DUPLEX
                - GARAGE_AREA
                - PARKING_AREA
                - CAR_PARK
                - UNDERGROUND_GARAGE
                - UNDERGROUND_PARKING_SPACE
                - BOAT_DOCK
              description: |-
                subtypes of a parking property to describe the selected
                estate type in detail.
                Descriptions for the enums above:
                - OUTSIDE: a parking space that is outside not in a garage
                - STREET_PARKING: a parking space along the street
                - CARPORT: a shelter for vehicles that is open-sided and
                  usually attached to a house
                - GARAGE: a building for parking one vehicle usually with a
                  vertical rolling door
                - DOUBLE_GARAGE: like a garage but for two vehicles
                - DUPLEX: double parking on one parking space with a
                  parking lift
                - GARAGE_AREA: an area with several garages only,
                  no houses attached
                - PARKING_AREA: a confined area full of parking spaces
                - CAR_PARK: a multistorey building for parking vehicles
                - UNDERGROUND_GARAGE: a car park that is mainly below earth
                - UNDERGROUND_PARKING_SPACE: a single parking space in an
                  underground garage
                - BOAT_DOCK: parking for a boat, a berth
              example: GARAGE
            senior:
              type: string
              enum:
                - LIVING
                - ASSISTED_LIVING
                - MEDICAL_CARE
              description: |-
                subtypes for senior-oriented apartments to describe the selected
                estate type in detail.
                Descriptions for the enums above:
                - LIVING: apartment in a senior-oriented environment (without
                  assistance, care and nursing)
                - ASSISTED_LIVING: apartment in a senior-oriented environment
                  with assistance. Optional services and personal care are
                  provided in a home-like, social setting, whereby the focus
                  is on the independence of the residents.
                - MEDICAL_CARE: apartment in a senior-oriented clinical setting,
                  nursing homes provide medical and personal care for people
                  in great need of care.
              example: ASSISTED_LIVING
            project:
              type: string
              enum:
                - MULTI_FAMILY_HOUSE
                - HOUSE_PARK
                - SINGLE_MULTI_HOUSES
                - MISCELLANEOUS
              description: >-
                subtypes of a real estate project.
                Descriptions for the enums above:
                - MULTI_FAMILY_HOUSE: is a project for a multi family house,
                  that is build as one building/project, but the individual
                  residential units in the multi family house will be sold separately.
                  The separated units/classifieds are assigned to the project and are
                  also displayed accordingly on the portal.
                  In comparison: `HOUSE.MULTI_FAMILY_HOUSE` is one
                  property/classified, that is also sold as one!
                - HOUSE_PARK: a collection of different house types
                - SINGLE_MULTI_HOUSES: **Note:** this entry is deprecated.
                  Use `HOUSE_PARK` instead.
                - MISCELLANEOUS: any other kind of project
              example: MULTI_FAMILY_HOUSE
        distributionType:
          type: string
          enum:
            - BUY
            - RENT
            - COMPULSORY_AUCTION
            - BUY_AUCTION
          description: |-
            the distribution type of the property.
            - BUY: regular type of property for sale
            - RENT: regular type of property for rent
            - COMPULSORY_AUCTION: auction ordered by the courts
            - BUY_AUCTION: bids for the property can be submitted within a
              limited time period. The seller can accept, reject or negotiate
              the bid. Most important difference to a classic auction: the
              highest bid does not necessarily have to win.
              de: Bieterverfahren
        location:
          type: object
          required:
            - postalcode
            - city
            - street
            - houseNumber
            - country
          description: geographical information of the real estate property
          additionalProperties: false
          properties:
            postalcode:
              type: string
              description: postalcode or zip of the property location. It can be empty when
                not applicable. Use an empty string for unknown value.
              example: "22455"
              maxLength: 32
            city:
              type: string
              description: city where the property is located. It can be empty when not
                applicable. Use an empty string for unknown value.
              example: Hamburg
              maxLength: 128
            street:
              type: string
              description: street where the property is located. It can also be a place name
                or any required neighbourhood information. It can be empty when
                not applicable. Use an empty string for unknown value.
              example: Hauptstrasse
              maxLength: 512
            houseNumber:
              type: string
              description: house number where the property is located. It can be empty when
                not applicable. Use an empty string for unknown value.
              example: "10"
              maxLength: 64
            unit:
              type: string
              description: An apartment, unit, office, lot, or other secondary unit designator
              example: Block C
              maxLength: 64
            staircase:
              type: string
              description: numbered/lettered staircase
              example: A
              maxLength: 64
            floorNumber:
              type: integer
              minimum: -5
              maximum: 999
              description: number of the floor in the building; 0 means ground floor, NOT
                first floor; 1 means first upper floor; -1 means first basement
                floor
              example: 2
            entrance:
              type: string
              description: numbered/lettered entrance
              example: "123"
              maxLength: 32
            state:
              type: string
              description: state within the country where the property is located
              example: Bavaria
              maxLength: 128
            country:
              type: string
              maxLength: 125
              example: DEU
              description: >-
                country where the property is located.
                **Note:** You are strongly encouraged to use ISO3166 country codes instead of country names.
                You can use the three-letter code (alpha-3) which is more closely related to the country name.
                ISO3166 country codes will be mandatory in the next major version.
            geometry:
              description: Coordinates of the property using geoJSON format. WGS84 (GPS)
                System expected.
              allOf:
                - type: object
                  description: GeoJSon geometry
                  externalDocs:
                    url: https://tools.ietf.org/html/rfc7946#section-3.1
                  anyOf:
                    - type: object
                      description: GeoJSon geometry
                      externalDocs:
                        url: https://tools.ietf.org/html/rfc7946#section-3.1.2
                      properties:
                        type:
                          type: string
                          enum:
                            - Point
                          description: the geometry type string
                        coordinates:
                          type: array
                          description: Point in 3D space
                          externalDocs:
                            url: https://tools.ietf.org/html/rfc7946#section-3.1.1
                          minItems: 2
                          maxItems: 3
                          items:
                            type: number
                            format: float
                    - type: object
                      description: GeoJSon geometry
                      externalDocs:
                        url: https://tools.ietf.org/html/rfc7946#section-3.1.4
                      properties:
                        type:
                          type: string
                          enum:
                            - LineString
                          description: the geometry type string
                        coordinates:
                          type: array
                          items:
                            $ref: "#/components/schemas/RealEstate/properties/location/properties/geometry/\
                              allOf/0/anyOf/0/properties/coordinates"
                    - type: object
                      description: A GeoJSon polygon is a closed ring of points (end point equals
                        start point)
                      externalDocs:
                        url: https://tools.ietf.org/html/rfc7946#section-3.1.6
                      properties:
                        type:
                          type: string
                          enum:
                            - Polygon
                          description: the geometry type string
                        coordinates:
                          type: array
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/RealEstate/properties/location/properties/geometry/\
                                allOf/0/anyOf/0/properties/coordinates"
                    - type: object
                      description: A GeoJSon multipoint is a point cloud built up by many,
                        notconnected points.
                      externalDocs:
                        url: https://tools.ietf.org/html/rfc7946#section-3.1.3
                      properties:
                        type:
                          type: string
                          enum:
                            - MultiPoint
                          description: the geometry type string
                        coordinates:
                          type: array
                          items:
                            $ref: "#/components/schemas/RealEstate/properties/location/properties/geometry/\
                              allOf/0/anyOf/0/properties/coordinates"
                    - type: object
                      description: GeoJSon is an array of type linestring
                      externalDocs:
                        url: https://tools.ietf.org/html/rfc7946#section-3.1.5
                      properties:
                        type:
                          type: string
                          enum:
                            - MultiLineString
                          description: the geometry type string
                        coordinates:
                          type: array
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/RealEstate/properties/location/properties/geometry/\
                                allOf/0/anyOf/0/properties/coordinates"
                    - type: object
                      description: GeoJSon geometry
                      externalDocs:
                        url: https://tools.ietf.org/html/rfc7946#section-3.1.7
                      properties:
                        type:
                          type: string
                          enum:
                            - MultiPolygon
                          description: the geometry type string
                        coordinates:
                          type: array
                          items:
                            type: array
                            items:
                              type: array
                              items:
                                $ref: "#/components/schemas/RealEstate/properties/location/properties/geometry/\
                                  allOf/0/anyOf/0/properties/coordinates"
            locationNote:
              description: additional information about the area where the object is located
              allOf:
                - $ref: "#/components/schemas/MultiLingualText"
            showAddress:
              type: boolean
              description: may the complete address be visible to everyone who sees the
                property online? if false, street and houseNumber may not be
                displayed in any case!
              example: true
            countrySpecific:
              type: object
              additionalProperties: false
              properties:
                de:
                  type: object
                  description: official geographical information for plots, especially for Germany
                  additionalProperties: false
                  properties:
                    govMapNo:
                      type: string
                      description: "government map number from the land registry office, de:
                        Flurnummer"
                      example: "3"
                    govMapPart:
                      type: string
                      description: "government map from the land registry office, de: Flurstück"
                      example: "35"
                    govRegisterPlace:
                      type: string
                      description: "city of the government, de: Grundbuch Ort, Gemarkung,
                        Vermessungsbezirk"
                      example: Musterstadt
                    govRegisterNo:
                      type: string
                      description: "government register number, de: Grundbuch Blatt"
                      example: "73"
                fr:
                  type: object
                  additionalProperties: false
                  properties:
                    inseeCode:
                      type: string
                      description: Govt Localisation Code INSEE
        prices:
          type: object
          description: contains different prices and price types for a property
          additionalProperties: false
          properties:
            currency:
              $ref: "#/components/schemas/CurrencyCodes"
            buy:
              type: object
              additionalProperties: false
              properties:
                price:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                  description: the purchase price of the property
                isLeaseBuyCombi:
                  type: boolean
                  description: the property can also be purchased as rental purchase
                  example: true
                leasehold:
                  type: object
                  description: "A building or plot is sold to a cheaper price, but the buyer will
                    not be the owner, but the leaseholder. If a property is
                    leasehold, it is allowed to be used in return for payment
                    (leasehold rent) according to the terms of a lease. de:
                    Erbpacht/Erbbaurecht"
                  required:
                    - amount
                    - priceTimeUnit
                  additionalProperties: false
                  properties:
                    isLeasehold:
                      type: boolean
                      description: If the property is sold with leasehold rights. For an exact
                        representation, please also fill in the following
                        fields.
                    amount:
                      type: number
                      minimum: 0
                      description: amount of the leasehold rent
                      example: 120
                    priceTimeUnit:
                      type: string
                      description: when does the leaseholdRent have to be paid, per month or per year
                      enum:
                        - MONTH
                        - YEAR
                      example: YEAR
                    duration:
                      type: number
                      minimum: 1
                      description: the leasehold duration in years. Usually a leasehold is 50-99
                        years. After that time, the leasehold often can be
                        extended.
                      example: 99
                    endDate:
                      type: string
                      format: date
                      description: date when the leasehold ends.
                      example: 2050-03-15
                operatingCosts:
                  description: "includes general maintenance costs, security, cleaning,
                    administration, insurances, etc. for the building. de:
                    Hausgeld"
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                    - $ref: "#/components/schemas/Accounting"
                  additionalProperties: false
                  properties:
                    priceTimeUnit:
                      type: string
                      description: time unit for the price
                      enum:
                        - DAY
                        - WEEK
                        - MONTH
                        - YEAR
                      example: DAY
                rentalIncome:
                  description: the real rental income of the latest period
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                  additionalProperties: false
                  properties:
                    priceTimeUnit:
                      type: string
                      description: rental income period
                      enum:
                        - MONTH
                        - YEAR
                      example: YEAR
                    priceInformation:
                      type: string
                      deprecated: true
                      description: DEPRECATED Tag for price information but no relevant here
                rentalIncomeExpect:
                  description: expected rental income in future periods
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                  additionalProperties: false
                  properties:
                    priceTimeUnit:
                      type: string
                      description: rental income period
                      enum:
                        - MONTH
                        - YEAR
                      example: YEAR
                    priceInformation:
                      type: string
                      deprecated: true
                      description: DEPRECATED Tag for price information but no relevant here
                parkingPrice:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                    - $ref: "#/components/schemas/ParkingStyle"
                  properties:
                    isOperatingCostsIncluded:
                      type: boolean
                      example: false
                pricePerSqUnit:
                  description: Price per space measure unit (square meter, square foot, hectar,
                    ...) which is defined at `spaces.spaceMeasureUnit`. If
                    `spaces.spaceMeasureUnit` is empty, `SQUARE_METER` is used
                    as default.
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                yieldFactor:
                  type: number
                  description: "for the calculation of the return. calculation: purchase price
                    divided by annual rental income"
                  example: 12.5
                countrySpecific:
                  type: object
                  additionalProperties: false
                  properties:
                    be:
                      type: object
                      additionalProperties: false
                      properties:
                        isSubjectToVat:
                          type: boolean
                          description: If false, a label newbuild will be displayed.
                          example: false
                        cadastralIncome:
                          allOf:
                            - $ref: "#/components/schemas/PriceCommon"
                          description: The cadastral income serves as the basis for taxation of the
                            theoretical income from your property. It is
                            proportional to the theoretical rental value of your
                            property. You can find this figure on your last
                            income tax return.
                        lifeAnnuity:
                          type: object
                          description: If it is a life annuity sell (Viager) with Belgian characteristics
                          additionalProperties: false
                          properties:
                            estimatedPropertyValue:
                              type: integer
                              example: 350000
                              minimum: 0
                              maximum: 5000000000
                              description: Indicates the estimated value of the property.
                            lumpSum:
                              type: integer
                              example: 35000
                              minimum: 0
                              description: 'Indicates the Lump sum (be: "bouquet").'
                            monthlyAmount:
                              type: integer
                              example: 1000
                              minimum: 0
                              description: Indicates the monthly annuity.
                          required:
                            - monthlyAmount
                            - lumpSum
                    fr:
                      type: object
                      additionalProperties: false
                      properties:
                        isReducedNotaryFees:
                          type: boolean
                          description: Reduced notary fees ?
                        notaryFeesFor:
                          type: string
                          enum:
                            - BUYER
                            - SELLER
                            - SHARED
                        lifeAnnuity:
                          description: If it is a life annuity sell (Viager), the monthly amount to pay
                          allOf:
                            - $ref: "#/components/schemas/PriceCommon"
                            - $ref: "#/components/schemas/PriceInformation"
                    at:
                      type: object
                      additionalProperties: false
                      properties:
                        operatingCostsNet:
                          type: object
                          additionalProperties: false
                          properties:
                            amount:
                              type: number
                              description: "operating costs excl. vat (as in the operating costs catalog); de:
                                BetriebskostenNetto exkl. Ust (lt.BK-Katalog)"
                          allOf:
                            - $ref: "#/components/schemas/PriceInformation"
                        heatingCostsNet:
                          type: object
                          additionalProperties: false
                          properties:
                            amount:
                              type: number
                              description: "heatingCosts excl. vat (if 0, no heatingCosts are included in
                                totalRent) de: HeizkostenNetto; Heizkosten exkl.
                                USt (wenn 0, dann keine HK in Warmmiete
                                enthalten)"
                          allOf:
                            - $ref: "#/components/schemas/PriceInformation"
                        miscCostsNet:
                          type: object
                          additionalProperties: false
                          properties:
                            amount:
                              type: number
                              description: "overallLoadGross minus rentNet, operatingCostsNet,
                                heatingCostsNet, overallLoadVat; de:
                                SonstigeKostenNetto; MonatlichKostenBrutto
                                abzgl, BetriebskostenNetto, HeizkostenNetto und
                                MonatlicheKostenUst"
                          allOf:
                            - $ref: "#/components/schemas/PriceInformation"
                        vatCostsPerMonth:
                          type: number
                          description: "sum of the monthly vat costs de: MonatlicheKostenUSt; summe der
                            monatlichen MwSt Kosten"
                        costsPerMonthGross:
                          type: object
                          additionalProperties: false
                          properties:
                            amount:
                              type: number
                              description: "sum of the monthly costs gross (incl. vat, additionalCosts,
                                heatingCosts, other costs) de:
                                MonatlicheKostenBrutto; Summe monatlicher Kosten
                                (inkl.Ust, BK, HK, Sonstige)"
                          allOf:
                            - $ref: "#/components/schemas/PriceInformation"
            rent:
              description: rent price information
              type: object
              additionalProperties: false
              properties:
                baseRent:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                  description: base rent without any operating costs, water, power, etc.
                baseRentPerYear:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                  description: reports yearly discounted base rent without any operating costs,
                    water, power, etc. To use only if you have already provided
                    a yearly non-negotiated amount in `price.rent.baseRent`
                    (i.e. with `prices.rent.priceTimeUnit = YEAR`).
                totalRent:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                  description: includes base rent and operating costs
                lease:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                  description: "lease is very similar to rent but not the same. As a tenant of
                    lease you have more rights: you may not only use the
                    property, but you may also generate a profit out of it.
                    typical examples: when you lease agriculture ground or a
                    gastronomy property."
                operatingCosts:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                    - $ref: "#/components/schemas/Accounting"
                  description: includes general maintenance costs, insurances, etc. for the
                    building. And sometimes even water and heating costs, but
                    this depends on the contract with the landlord.
                heatingCosts:
                  allOf:
                    - $ref: "#/components/schemas/PriceCommon"
                    - $ref: "#/components/schemas/PriceInformation"
                    - $ref: "#/components/schemas/Accounting"
                  description: costs for the heating
                isHeatingIncludedInOC:
                  type: boolean
                  description: are the costs for heating already included in the operating costs?
                  example: true
                isHeatingIncludedInTR:
                  type: boolean
                  description: are the costs for heating already included in the total rent?
                  example: true
                pricePerSqUnit:
                  description: Price per space measure unit (square meter, square foot, hectar,
                    ...) which is defined at `spaces.spaceMeasureUnit`. If
                    `spaces.spaceMeasureUnit` is empty, `SQUARE_METER` is used
                    as default. `prices.rent.pricePerSqUnit` is usually based on
