    GET /classifieds | Returns results without limiting the number of results | Returns the 250 last items by default. The number of results can be limited using the 'limit' query string parameter.<br />The 'nextToken' query string parameter is also now available to return the remaining results when the 'limit' parameter has been used in the query.<br />Example 1: `GET /classifieds?limit=10`<br />Example 2: `GET /classifieds?nextToken=eyJ2ZXJzaW9uIjoiMiIsImNsYXNzaWZpZWRJZCI6ImFhYjJjNTFkLWU2MmYtNDFjNS1iMmM3LWFkMjJhNjk2MmUzOSIsImN1c3RvbWVySWQiOiJ0ZXN0LXNlci0xIn0=`
    GET /classifieds/:id/media | Returns results without limiting the number of results | Returns the 250 last items by default.<br />The 'nextToken' query string parameter is now available to return the remaining results.<br />Example : `GET /classifieds?nextToken=eyJ2ZXJzaW9uIjoiMiIsImNsYXNzaWZpZWRJZCI6ImFhYjJjNTFkLWU2MmYtNDFjNS1iMmM3LWFkMjJhNjk2MmUzOSIsImN1c3RvbWVySWQiOiJ0ZXN0LXNlci0xIn0=`

