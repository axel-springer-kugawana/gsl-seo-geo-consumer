    ContactsCollidingError:
      description: "Represents a classified already exists error"
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: "object"
          required:
            - errors
            - errorSource
          properties:
            errors:
              description: "Array of errors"
              type: array
              items:
                type: object
                required:
                  - name
                  - reason
                properties:
                  name:
                    type: string
                    description: Field on which the error occurs
                    example: 'data.contact.*'
                  reason:
                    type: string
                    description: Error reason
                    example: "The classified has been submitted to be attached with conflicting contact's information. The following fields cannot be set simultaneously: 'data.contact.*', 'specific.gsl.contact.*'"
            errorSource:
              description: "The source of the error"
              type: string
              enum:
                - body
              example: body
      example:
        type: "{{API_DOC_URL}}#section/Errors/Colliding-Contacts-Information-Error"
        title: "Bad request"
        detail: "Colliding information"
        status: 400
        errorSource: "body"
        errors:
          - name: "data.contact.*"
            reason: "The classified has been submitted to be attached with conflicting contact's information. The following fields cannot be set simultaneously: 'data.contact.*', 'specific.gsl.contact.*' "
    ClassifiedAlreadyExistsError:
      description: "Represents a classified already exists error"
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        type: "{{API_DOC_URL}}#section/Errors/Duplicated-Classifieds-Error"
        title: "Duplicated classified"
        detail: "This offererEstateId: ref-1-example is already associated with an existing classified identified by classifiedId: 5c597a63-6932-4b0c-a2a0-2fd935be175. Classifieds must have unique offerEstateId."
        instance: "00-0af7651916cd43dd8448eb211c80319c-b9c7c989f97918e1-01"
        status: 400
    PreconditionFailedError:
      description: "Represents a precondition failed error"
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        type: "about:blank"
        title: "Precondition Failed"
        detail: "The if-match header don't match with the revision of the classified you are trying to operate with."
        instance: "00-0af7651916cd43dd8448eb211c80319c-b9c7c989f97918e1-01"
        status: 412
    ValidationErrorResponse:
      description: "Represents a validation error"
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: "object"
          required:
            - errors
            - errorSource
          properties:
            errors:
              description: "Array of errors"
              type: array
              items:
                type: object
                required:
                  - name
                  - reason
                properties:
                  name:
                    type: string
                    description: Field on which the error occurs
                    example: /data/estateSubTypes/trading
                  reason:
                    type: string
                    description: Error reason
                    example: "must be equal to one of the allowed values: STORE, SHOWROOM_SPACE, SHOPPING_CENTRE, KIOSK, SALES_AREA."
            errorSource:
              description: "The source of the error"
              type: string
              enum:
                - body
                - requestParameter
                - contentType
              example: body
    ResourceAccessScopeForbiddenError:
      description: "Represents a ressource forbidden error"
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        type: "about:blank"
        title: "Forbidden"
        detail: "You don't have sufficient permissions to perform this action. Please check the scopes set in your authentication token."
        instance: "00-0af7651916cd43dd8448eb211c80319c-b9c7c989f97918e1-01"
        status: 403
    ErrorResponse:
      description: "Represents an error"
      type: "object"
      required:
        - title
        - type
        - status
        - detail
        - instance
      properties:
        type:
          type: "string"
          description: |
            The URI reference that identifies the problem type. The "about:blank" URI, when used as a problem type, indicates that the problem has no additional semantics beyond that of the HTTP status code
          example: "{{API_DOC_URL}}#section/Errors/Validation-Error"
        title:
          description: "An human-readable summary of the problem type"
          type: "string"
          example: "Bad request"
        detail:
          description: "A human-readable explanation specific to this occurrence of the problem"
          type: "string"
          example: "Your request has not been validated"
        instance:
          description: "A URI reference that identifies the specific occurrence of the problem"
          example: 00-0af7651916cd43dd8448eb211c80319c-b9c7c989f97918e1-01
          type: string
          pattern: "^([0-9a-f]{2})-([0-9a-f]{32})-([0-9a-f]{16})-([0-9a-f]{2})$"
        status:
          description: "The HTTP status code generated for this occurrence of the problem"
          type: "number"
          example: 400
    classifiedsPatch:
      type: array
      description: "A JSONPatch classified."
      items:
        oneOf:
          - type: object
            properties:
              op:
                type: string
                description: The operation to be applied on the given JSON-Pointer
                enum:
                  - add
              path:
                type: string
                description: The JSON-Pointer
                pattern: "(/(([^/~])|(~[01]))*)"
                example: '/data/texts/description/fr'
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                description: The value to be used within the operation
                example: 'The french description.'
            required:
                - op
                - path
                - value
          - type: object
            properties:
              op:
                type: string
                description: The operation to be applied on the given JSON-Pointer
                enum:
                  - remove
              path:
                type: string
                description: The JSON-Pointer
                pattern: "(/(([^/~])|(~[01]))*)"
                example: '/specific/gsl/mainContactPerson/phoneNumber'
            required:
              - op
              - path
  requestBodies: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []