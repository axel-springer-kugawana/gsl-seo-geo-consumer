    PriceCommon:
      type: object
      description: common fields for all prices
      additionalProperties: false
      properties:
        amount:
          type: number
          minimum: 0
          description: amount of the select priceType
          example: 950
        vatValue:
          type: number
          minimum: 0
          description: the vat value in currency
          example: 1000
        vatPercent:
          type: number
          minimum: 0
          maximum: 100
          description: the vat value in percent
          example: 19.6
        isVatIncluded:
          type: boolean
          description: vat is included in the price
          example: false
    PriceInformation:
      type: object
      properties:
        priceInformation:
          type: string
          enum:
            - PRICE_ON_DEMAND
            - BASIS_FOR_NEGOTIATION
          description: |-
            - PRICE_ON_DEMAND: specific flag for displaying this price on the
              portal/website. If PRICE_ON_DEMAND is chosen, the price MUST NOT
              be shown! It may only be used as search price!
            - BASIS_FOR_NEGOTIATION: the price is not fixed, it is negotiable.
              If the price is FIXED, priceInformation has to be empty / NULL.
          example: PRICE_ON_DEMAND
    Orientation:
      type: string
      description: cardinal and ordinal geographical directions
      enum:
        - NORTH
        - EAST
        - SOUTH
        - WEST
        - NORTH_EAST
        - SOUTH_EAST
        - NORTH_WEST
        - SOUTH_WEST
      example: NORTH
    EstateType:
      type: string
      enum:
        - HOUSE
        - APARTMENT
        - PLOT
        - OFFICE
        - TRADING
        - GASTRONOMY_HOTEL
        - STORAGE_PRODUCTION
        - AGRICULTURE_FORESTRY
        - PARKING
        - SENIOR
        - PROJECT
        - MISCELLANEOUS
      example: HOUSE
      description: |-
        the general type of the property.
        To classify it in detail, please use the subtypes.
        descriptions for the enums above:
        - HOUSE: a building where people live in
        - APARTMENT: a set of rooms for living in within a building; a flat
        - PLOT: a piece of land
        - OFFICE: a room, set of rooms, or building where the business of a
          commercial or industrial organization or of a professional
          person is conducted. also medical offices are included here.
        - TRADING: all kind of properties concerning trading, retail
          and whole sale
        - GASTRONOMY_HOTEL: all kind of properties concerning the hotel
          and catering industry
        - STORAGE_PRODUCTION: an industrial or production site, warehouse,
          storage unit or building
        - AGRICULTURE_FORESTRY: all kind of properties concerning
          agriculture and forestry in the broadest sense
        - PARKING: all parking relevant properties for any kind of vehicles
        - SENIOR: senior-oriented living properties
        - PROJECT: usually a project is made up of more single properties,
          like a multi family house and often it is not finished yet but
          planned or under construction
        - MISCELLANEOUS: every other kind of property that can not be
          classified into the other estateTypes
    Accounting:
      type: object
      properties:
        accounting:
          type: string
          description: |-
            How often the costs are paid and how:
            - FIXED: fixed amount paid each time unit
            - REAL_USAGE: amount calculated on real usage paid each time unit
            - ADJUSTMENT: fixed amount paid each time unit and regular
              (yearly?) adjustment based on real usage
          enum:
            - FIXED
            - REAL_USAGE
            - ADJUSTMENT
          example: ADJUSTMENT
    ParkingStyle:
      type: object
      properties:
        parkingStyle:
          type: string
          enum:
            - OUTSIDE
            - STREET_PARKING
            - CARPORT
            - GARAGE
            - DOUBLE_GARAGE
            - DUPLEX
            - GARAGE_AREA
            - PARKING_AREA
            - CAR_PARK
            - UNDERGROUND
            - BOAT_DOCK
          description: |-
            if the property has an additional garage/parking space then
            you can specify the parking style in details here.
            A parking lot can only be described by one (the most appropriate)
            item, not by several.
            Descriptions for the enums above:
            - OUTSIDE: a parking space that is outside, not in a garage
            - STREET_PARKING: a parking space along the street
            - CARPORT: a shelter for vehicles that is open-sided
              and usually attached to a house
            - GARAGE: a building for parking one vehicle usually
              with a vertical rolling door
            - DOUBLE_GARAGE: like a garage but for two vehicles
            - DUPLEX: double parking on one parking space with a
              parking lift
            - GARAGE_AREA: a single garage in an area with
              several garages only, no houses attached
            - PARKING_AREA: a single parking lot in a confined
              area full of parking spaces
            - CAR_PARK: a single parking space in an usually
              multistorey car park building
            - UNDERGROUND: a single parking space in an
              underground garage (car park mainly below earth)
            - BOAT_DOCK: parking for a boat (a berth)
          example: GARAGE
    Specific:
      type: object
      description: Information related to the classified
      additionalProperties: false
      properties:
        gsl:
          type: object
          description: Information related to the classified
          additionalProperties: false
          properties:
            mainContactPerson:
              allOf:
                - $ref: '#/components/schemas/ContactInformation'
              description: |-
                Main contact person details

                Deprecated in favor of `data.contact.mainContactPersonId`
              deprecated: true
            additionalContactPerson:
              allOf:
                - $ref: '#/components/schemas/ContactInformation'
              description: |-
                Additional contact person details

                Deprecated in favor of `data.contact.additionalContactPersonId`
              deprecated: true
            mandateCoOwner1:
              allOf:
                - $ref: '#/components/schemas/ContactInformation'
              description: 1st estate agent mandate co-owner person details
            mandateCoOwner2:
              allOf:
                - $ref: '#/components/schemas/ContactInformation'
              description: 2nd estate agent mandate co-owner person details
            mandateCoOwner3:
              allOf:
                - $ref: '#/components/schemas/ContactInformation'
              description: 3rd estate agent mandate co-owner person details
        iwt:
          type: object
          description: Information related to the classified
          additionalProperties: false
    ContactInformation:
      type: object
      properties:
        name:
          type: string
          example: Jean-Paul Sartre
          description: Full name
        phoneNumber:
          type: string
          example: +1 555780909
          description: Main phone number
        mobilePhoneNumber:
          type: string
          example: +1 666780909
          description: Mobile phone number
        faxNumber:
          type: string
          example: +4940 12345678
        email:
          type: string
          format: email
          example: max@mustermann.de
          description: E-mail of the contact
        companyName:
          type: string
          example: OpenImmo
        address:
          type: object
          properties:
            street:
              type: string
            houseNumber:
              type: string
            postalcode:
              type: string
            city:
              type: string
    Media:
