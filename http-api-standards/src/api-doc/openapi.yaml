    patch:
      tags:
        - Media
      operationId: setMediaMetadata
      summary: Update the metadata of a classified media.
      description: |
        Applies the requested changes to the given classified media (modify/remove metadata). Read [RfC 6902 - JSON Patch](https://tools.ietf.org/html/rfc6902) for more information.

        At the moment, the following properties can be patched:
        * title
        * displayOrder
        * category

        ## Samples
        ### Adding or updating the displayOrder
        ```json
        [
          {
            "op": "add",
            "path": "/displayOrder",
            "value": 3
          }
        ]
        ```
        ### Removing the title
        ```json
        [
          {
            "op": "remove",
            "path": "/title"
          }
        ]
        ```
        ### Adding or updating the category
        ```json
        [
          {
            "op": "add",
            "path": "/category",
            "value": "BATHROOM"
          }
        ]
        ```
      parameters:
        - name: classifiedId
          in: path
          description: ID of classified to update
          required: true
          schema:
            type: string
            minLength: 1
            format: uuid
        - name: mediaId
          in: path
          description: ID of the media to update
          required: true
          schema:
            type: string
            minLength: 1
            format: uuid
        - $ref: '#/components/parameters/traceparentHeader'
        - $ref: '#/components/parameters/userAgentHeader'
