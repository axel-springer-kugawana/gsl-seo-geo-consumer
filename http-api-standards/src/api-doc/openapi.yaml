          type: array
          description: >-
            collection of content description tags
          example: ["INDOOR", "POOL"]
          items:
            type: string
            description: >-
              content description tag of the given media
            enum:
              - "BALCONY"
              - "BASEMENT"
              - "BATHROOM"
              - "BEDROOM"
              - "CHILDREN_ROOM"
              - "CORRIDOR"
              - "COVER_PICTURE"
              - "ENERGY_CERTIFICATE"
              - "ENTRY_HALL"
              - "FLOOR_PLAN"
              - "GARAGE"
              - "GARDEN"
              - "HOUSE_VIEW"
              - "INDOOR"
              - "KITCHEN"
              - "LIVING_ROOM"
              - "LOGO"
              - "MAP"
              - "MISC"
              - "OUTDOOR"
              - "OUTDOOR_BUILDING"
              - "OUTDOOR_HOUSE"
              - "OUTSIDE_VIEW"
              - "POOL"
              - "PROPERTY_INFORMATION"
              - "SCHEMA"
              - "SITE_PLAN"
              - "STAIRS"
              - "STORAGE_ROOM"
              - "SURROUNDING"
              - "TERRACE"
              - "TOILETS"
              - "VERANDA"
              - "VIEW_FROM_PROPERTY"
              - "WORK_ROOM"
            example: "TERRACE"
        title:
          $ref: '#/components/schemas/MediaTitle'
        url:
          type: string
          format: url
          description: >-
            URL of the media.
          example: "http://a.com/a.jpg"
      required:
        - url
        - mediaType
      additionalProperties: false
    MediaPatch:
      type: array
      items:
        oneOf:
          - type: object
            properties:
              op:
                type: string
                description: The operation to be applied on the given JSON-Pointer
                enum:
                    - add
              path:
                type: string
                description: The JSON-Pointer
                pattern: "(/(([^/~])|(~[01]))*)"
                enum:
                  - "/title"
              value:
                $ref: '#/components/schemas/MediaTitle'
            required:
                - op
                - path
                - value
          - type: object
            properties:
              op:
                type: string
                description: The operation to be applied on the given JSON-Pointer
                enum:
                    - add
              path:
                type: string
                description: The JSON-Pointer
                pattern: "(/(([^/~])|(~[01]))*)"
                enum:
                  - "/displayOrder"
              value:
                $ref: '#/components/schemas/MediaDisplayOrder'
            required:
                - op
                - path
                - value
          - type: object
            properties:
              op:
                type: string
                description: The operation to be applied on the given JSON-Pointer
                enum:
                    - add
              path:
                type: string
                description: The JSON-Pointer
                pattern: "(/(([^/~])|(~[01]))*)"
                enum:
                  - "/category"
              value:
                $ref: '#/components/schemas/MediaCategory'
            required:
                - op
                - path
                - value
          - type: object
            properties:
              op:
                type: string
                description: The operation to be applied on the given JSON-Pointer
                enum:
                    - remove
              path:
                type: string
                description: The JSON-Pointer
                pattern: "(/(([^/~])|(~[01]))*)"
                enum:
                  - "/category"
                  - "/displayOrder"
                  - "/title"
            required:
                - op
                - path
