    MultiLingualText:
      title: Multi-lingual Textual Component based on ISO 639-1:2002 (Alpha-2 code)
      type: object
      description: This part of ISO 639 provides a code consisting of language code
        elements  comprising two-letter language identifiers for the
        representation of names  of languages. The language identifiers
        according to this part of ISO 639  were devised originally for use in
        terminology, lexicography and linguistics,  but may be adopted for any
        application requiring the expression of language in two-letter coded
        form, especially in computerized systems.
      externalDocs:
        description: >-
          There are 184 two-letter codes registered as of December 2018. The
          registered codes cover the world's major languages.
          The alpha-2 code was devised for practical use for most of the major languages of the world that are not only most frequently represented in the total body of the world's literature, but which also comprise a considerable volume of specialized languages and terminologies.
          Additional language identifiers are created when it becomes apparent that a significant body of documentation written in specialized languages and terminologies exists. Languages designed exclusively for machine use, such as computer-programming languages, are not included in this code.
        url: https://www.iso.org/standard/22109.html
      additionalProperties: false
      example:
        de: Hallo!
        en: Hello!
        fr: Bonjour!
      properties:
        aa:
          type: string
          description: Afro-Asiatic Afar Afaraf  aar  aar  aar
        ab:
          type: string
          description: Northwest Caucasian Abkhazian аҧсуа бызшәа,
            аҧсшәа  abk  abk  abk  also known as Abkhaz
        ae:
          type: string
          description: Indo-European Avestan avesta  ave  ave  ave  ancient
        af:
          type: string
          description: Indo-European Afrikaans Afrikaans  afr  afr  afr
        ak:
          type: string
          description: Niger–Congo Akan Akan  aka  aka  aka + 2  macrolanguage, Twi is
            [tw/twi], Fanti is [fat]
        am:
          type: string
          description: Afro-Asiatic Amharic አማርኛ  amh  amh  amh
        an:
          type: string
          description: Indo-European Aragonese aragonés  arg  arg  arg
        ar:
          type: string
          description: Afro-Asiatic Arabic العربية  ara  ara  ara
            + 29  macrolanguage, Standard Arabic is [arb]
