paths:
  '/classifieds':
    post:
      tags:
        - Classifieds
      operationId: createClassified
      summary: Create a new classified.
      description: This endpoint allows you to create a new classified to be published on Aviv's portals. Depending on the parameters sent along with the body payload, the classified can be created but not published. This endpoint returns synchronously a response informing if the body payload format is valid or not. In the case of a valid format, the endpoint will return a 202 Accepted HTTP status code with URL links to related resources. In the case of invalid format, the endpoint will return a 400 Invalid format HTTP status code with the details of the rejection's reasons.
      parameters:
        - $ref: '#/components/parameters/traceparentHeader'
        - $ref: '#/components/parameters/userAgentHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvivClassified'
      responses:
        'default':
          description: Unexpected error
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json+problem:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '202':
          description: Accepted
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                type: object
                properties:
                  classifiedId:
                    type: string
                    example: 5c597a63-6932-4b0c-a2a0-2fd935be1755
                    format: uuid
                  links:
                    type: array
                    items:
                      properties:
                        statuses:
                          type: string
                          description: Retrieve the statuses of the classified with GET /classifieds/{classifiedId}/statuses using `classifiedId` from the response body
                          example: '/classifieds/5c597a63-6932-4b0c-a2a0-2fd935be1755/statuses'
        '400':
          description: Bad Request
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json+problem:
              schema:
                oneOf:
                 - $ref: "#/components/schemas/ValidationErrorResponse"
                 - $ref: "#/components/schemas/ParsingErrorResponse"
                 - $ref: "#/components/schemas/BadRequestErrorResponse"
                 - $ref: "#/components/schemas/ClassifiedAlreadyExistsError"
                 - $ref: "#/components/schemas/ContactsCollidingError"
        '403':
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: "#/components/schemas/ResourceAccessScopeForbiddenError"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        '404':
          description: Not found
          content:
            application/json+problem:
              schema:
                oneOf:
                 - $ref: "#/components/schemas/ResourceAccessForbiddenError"
                 - $ref: "#/components/schemas/RessourceNotFoundError"
        '500':
          description: Internal server error
