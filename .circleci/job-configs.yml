version: 2.1

parameters:
  run-http-api-standards-job:
    type: boolean
    default: false
  run-classified-management-connector-job:
    type: boolean
    default: false

orbs:
  aws-cli: circleci/aws-cli@4.1.2
  aws-s3: circleci/aws-s3@3.1.1
  terraform: circleci/terraform@3.2.1

jobs:
  build-classified-management-connector:
    docker:
      - image: cimg/node:20.11.0
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install pnpm package manager
          command: |
            sudo corepack enable
            sudo corepack prepare --activate
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID_DEV
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY_DEV
      - run:
          name: Install Dependencies
          command: pnpm install
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
      - run:
          name: Test
          command: pnpm -C src/ run test
      - run:
          name: Build
          command: pnpm -C src/ run build:lambdas
      - persist_to_workspace:
          paths:
            - "."
          root: "~/project"
            
  deploy-classified-management-connector:
    executor: 
      name: terraform/default
      tag: "1.5.7"
    parameters:
      ENV:
        type: string
    working_directory: ~/project
    steps:
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID_DEV
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY_DEV
      - attach_workspace:
          at: ./
      - terraform/init:
          path: ./infra
      - terraform/plan:
          path: ./infra
          var_file: ./dev.tfvars
          

workflows:
  classified-management-connector:
    when: << pipeline.parameters.run-classified-management-connector-job >>
    jobs:
      - build-classified-management-connector
      - deploy-classified-management-connector:
          ENV: "dev"
          requires:
            - build-classified-management-connector
