version: 2.1

parameters:
  run-http-api-standards-job:
    type: boolean
    default: false
  run-geo-management-connector-job:
    type: boolean
    default: false
aliases:
  - &devfilter
    filters:
      branches:
        ignore: main
  - &previewfilter
    filters:
      branches:
        only: main
        ignore: /.*/
  - &livefilter
    filters:
      tags:
        only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      branches:
        only: main
        ignore: /.*/
orbs:
  aws-cli: circleci/aws-cli@4.1.2
  aws-s3: circleci/aws-s3@3.1.1
  terraform: circleci/terraform@3.2.1

jobs:
  build-geo-management-connector:
    docker:
      - image: cimg/node:20.11.0
    parameters:
      ENV_SECRETS:
        type: string
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm package manager
          command: |
            sudo corepack enable
            sudo corepack prepare --activate
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID_<<parameters.ENV_SECRETS>>
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY_<<parameters.ENV_SECRETS>>
      - run:
          name: Install Dependencies
          command: pnpm install --no-frozen-lockfile
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
      - run:
          name: Test
          command: pnpm -C src/ run test
      - run:
          name: Build
          command: pnpm -C src/ run build:lambdas
      - persist_to_workspace:
          paths:
            - "."
          root: "~/project"
            
  push-geo-bulk-load-image:
    docker:
      - image: cimg/base:2024.02
    parameters:
      ENV:
        type: string
      ENV_SECRETS:
        type: string
      APPLICATION:
        type: string
        default: "gm-consumer"
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: ./
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID_<<parameters.ENV_SECRETS>>
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY_<<parameters.ENV_SECRETS>>
      - run:
          name: Build and push the geo bulk load image
          command: |
            set -eu
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com"
            # Repository created by the geo-bulk-load terraform module, hence the
            # push running after the deploy job.
            REPOSITORY="<<parameters.APPLICATION>>-<<parameters.ENV>>-geo-bulk-load"
            aws ecr get-login-password --region eu-west-1 \
              | docker login --username AWS --password-stdin "${REGISTRY}"
            docker build \
              -f src/geo-bulk-load/Dockerfile \
              -t "${REGISTRY}/${REPOSITORY}:${CIRCLE_SHA1}" \
              -t "${REGISTRY}/${REPOSITORY}:latest" \
              src
            docker push "${REGISTRY}/${REPOSITORY}:${CIRCLE_SHA1}"
            docker push "${REGISTRY}/${REPOSITORY}:latest"

  deploy-geo-management-connector:
    executor:
      name: terraform/default
      tag: "1.5.7"
    parameters:
      ENV:
        type: string
      ENV_PATH_FILE:
        type: string
      ENV_SECRETS:
        type: string
    working_directory: ~/project
    steps:
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID_<<parameters.ENV_SECRETS>>
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY_<<parameters.ENV_SECRETS>>
      - attach_workspace:
          at: ./
      - terraform/init:
          path: ./infra
          backend_config: "backend.<<parameters.ENV>>.tfvars"
      - terraform/plan:
          path: ./infra
          var_file: <<parameters.ENV_PATH_FILE>>
      - terraform/apply:
          path: ./infra
          var_file: <<parameters.ENV_PATH_FILE>>

workflows:
  geo-management-connector-dev:
    when: << pipeline.parameters.run-geo-management-connector-job >>
    jobs:
      - build-geo-management-connector:
          <<: *devfilter
          ENV_SECRETS: "DEV"
      - deploy-geo-management-connector:
          <<: *devfilter
          ENV: "dev"
          ENV_SECRETS: "DEV"
          ENV_PATH_FILE: "./dev.tfvars"
          requires:
            - build-geo-management-connector
      - push-geo-bulk-load-image:
          <<: *devfilter
          ENV: "dev"
          ENV_SECRETS: "DEV"
          requires:
            - deploy-geo-management-connector
  geo-management-connector-preview:
    when: << pipeline.parameters.run-geo-management-connector-job >>
    jobs:
      - build-geo-management-connector:
            ENV_SECRETS: "PREVIEW"
            <<: *previewfilter
      - deploy-geo-management-connector:
            <<: *previewfilter
            ENV: "preview"
            ENV_SECRETS: "PREVIEW"
            ENV_PATH_FILE: "./preview.tfvars"
            requires:
              - build-geo-management-connector
      - push-geo-bulk-load-image:
            <<: *previewfilter
            ENV: "preview"
            ENV_SECRETS: "PREVIEW"
            requires:
              - deploy-geo-management-connector
  geo-management-connector-live:
    when: << pipeline.parameters.run-geo-management-connector-job >>
    jobs:
      - build-geo-management-connector:
          ENV_SECRETS: "LIVE"
          <<: *livefilter
      - promote:
          <<: *livefilter
          name: Approve deploy to prod 
          type: approval
          requires:
            - build-geo-management-connector
      - deploy-geo-management-connector:
          <<: *livefilter
          ENV: "live"
          ENV_SECRETS: "LIVE"
          ENV_PATH_FILE: "./live.tfvars"
          requires:
            - build-geo-management-connector
            - Approve deploy to prod
      - push-geo-bulk-load-image:
          <<: *livefilter
          ENV: "live"
          ENV_SECRETS: "LIVE"
          requires:
            - deploy-geo-management-connector
