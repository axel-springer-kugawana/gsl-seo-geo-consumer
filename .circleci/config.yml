version: 2.1

setup: true

orbs:
  path-filtering: circleci/path-filtering@0.1.1

workflows:
  always-run:
    jobs:
      - path-filtering/filter:
          name: check-updated-files
          mapping: |
            .* run-geo-management-connector-job true
          base-revision: main
          config-path: .circleci/job-configs.yml