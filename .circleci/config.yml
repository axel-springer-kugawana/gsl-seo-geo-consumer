version: 2.1

jobs:
  generate-api-doc:
      docker:
        - image: cimg/python:3.10.12-node
      parameters:
        OPENAPI_PATH:
          type: string
      working_directory: ~/project
      steps:
        - checkout
        - attach_workspace:
            at: ./
        - run:
            name: Install dependencies
            command: |
              pip install setuptools
              pip install PyYAML
        - run:
            name: Generate bundled html files
            command: |
              npx @redocly/cli build-docs << parameters.OPENAPI_PATH >> -o ./redoc-openapi.html
              python http-api-standards/src/api-doc/scripts/swagger-yaml-to-html.py < << parameters.OPENAPI_PATH >> > swagger-openapi.html
        - store_artifacts:
            path: ~/project/redoc-openapi.html
            destination: redoc-openapi.html
        - store_artifacts:
            path: ~/project/swagger-openapi.html
            destination: swagger-openapi.html

workflows:
  http-api-standards:
    jobs:
      - generate-api-doc:
          OPENAPI_PATH: "http-api-standards/src/api-doc/openapi.yaml"