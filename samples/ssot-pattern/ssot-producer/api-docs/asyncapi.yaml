asyncapi: 2.6.0
info:
  title: SSoT SSoT Stream API
  version: 1.0.0
channels:
  SSoTEntityEvents:
    publish:
      message:
        oneOf:
          - $ref: "#/components/messages/SSoTEntityUpdatedEvent"
          - $ref: "#/components/messages/SSoTEntityCreatedEvent"
          - $ref: "#/components/messages/SSoTEntityDeletedEvent"
components:
  messages:
    SSoTEntityUpdatedEvent:
      payload:
        title: SSoTEntityUpdatedEvent
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            title: SSoTEntityUpdatedData
            properties:
              type:
                title: SSoTEntityUpdatedEventType
                const: ssotentity-updated.v1
              data:
                title: SSoTEntityStateEventData
                $ref: "#/components/schemas/SSoTEntityStateEventData"
    SSoTEntityDeletedEvent:
      payload:
        title: SSoTEntityDeletedEvent
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            title: SSoTEntityDeletedData
            properties:
              type:
                title: SSoTEntityDeletedEventType
                const: ssotentity-deleted.v1
              data:
                title: SSoTEntityDeletedEventData
                $ref: "#/components/schemas/SSoTEntityDeletedEventData"
    SSoTEntityCreatedEvent:
      payload:
        title: SSoTEntityCreatedEvent
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            title: SSoTEntityCreatedData
            properties:
              type:
                title: SSoTEntityCreatedEventType
                const: ssotentity-created.v1
              data:
                title: SSoTEntityStateEventData
                $ref: "#/components/schemas/SSoTEntityStateEventData"
  schemas:
    CloudEvent:
      title: CloudEventEnvelope
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        idempotencykey:
          type: string
          format: uuid
        data:
          type: object
        type:
          type: string
        specversion:
          type: string
          const: "1.0"
      required:
        - data
        - id
        - type
        - source
        - specversion
    SSoTEntityStateEventData:
      allOf:
        - $schema: http://json-schema.org/draft-04/schema#
          $id: SSoTEntityModel
          type: object
          properties:
            id:
              type: string
            estateType:
              type: string
            distributionType:
              type: string
          required:
            - estateType
            - distributionType
            - id
        - $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            metadata:
              $id: SsotEntityMetadata
              type: object
              properties:
                objectVersion:
                  type: number
                dataModelVersion:
                  type: string
                partition:
                  type: string
              required:
                - objectVersion
                - dataModelVersion
                - partition
          required:
            - metadata
    SSoTEntityDeletedEventData:
      allOf:
        - title: SSoTEntityData
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            id:
              type: string
          required:
            - id
        - $schema: http://json-schema.org/draft-07/schema#
          type: object
          title: SSoTEntityMetadata
          properties:
            metadata:
              $id: SsotEntityMetadata
              type: object
              properties:
                objectVersion:
                  type: number
                dataModelVersion:
                  type: string
                partition:
                  type: string
              required:
                - objectVersion
                - dataModelVersion
                - partition
          required:
            - metadata
