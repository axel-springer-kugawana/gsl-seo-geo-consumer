asyncapi: '2.6.0'
info:
  title: Classified Event Driven API sample
  version: 1.0.0
  description: This API documentation showcases how we could leverage the use of AsyncAPI along with CloudEvent to define Event Driven API Documentation
channels:
  classified-events:
    subscribe:
      message:
        oneOf:
        - $ref: '#/components/messages/ClassifiedCreated'
        - $ref: '#/components/messages/ClassifiedCensored'
components:
  messages:
    ClassifiedCreated:
      payload:
         $ref: '#/components/schemas/ClassifiedCreatedEvent'
    ClassifiedCensored:
      payload:
         $ref: '#/components/schemas/ClassifiedCensoredEvent'

  schemas:
    ClassifiedCreatedEvent:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
     
      properties:
        data:
          $ref: '#/components/schemas/ClassifiedCreatedEventData'
        type:
          $ref: '#/components/schemas/ClassifiedCreatedV1EventType'
        subject:
          type: string
      required:
        - data
  
    ClassifiedCensoredEvent:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
      properties:
        data:
          type: object
          $ref: '#/components/schemas/ClassifiedCensoredEventData'
        type:
          $ref: '#/components/schemas/ClassifiedCensoredV1EventType'
      required:
        - data

    EventEnvelope:
      type: object
      allOf:
      ## https://raw.githubusercontent.com/cloudevents/spec/v1.0.1/spec.json
      ## We reference a local copy of cloudevent specification eventhough json schema supports remote references.
      ## The reason is that backstage is not able to read remote files from raw.githubusercontent.com.
      ## see: https://roadie.io/docs/getting-started/openapi-specs/#step-1-create-an-api-kind:~:text=Note%20that%20if%20you%20are%20hosting%20your%20OpenAPI%20specs%20in%20GitHub%20and%20referencing%20them%20with%20the%20%24openapi%20property%2C%20the%20link%20must%20point%20to%20the%20URL%20starting%20with%20https%3A//github.com%20and%20not%20https%3A//raw.githubusercontent.com.
      - $ref: '../../cloudevent-1.0.1.json' 
      properties:
        id:
          type: string
          format: uuid
        eventcategory:
          $ref: '#/components/schemas/EventCategory'
        idempotencykey:
          type: string
          format: uuid
        correlationid:
          type: string
          format: uuid

    ClassifiedCensoredV1EventType:
      type: string
      enum: 
          - classified-censored.v1

    ClassifiedCreatedV1EventType:
      type: string
      enum: 
          - classified-created.v1

    EventCategory:
          type: string
          enum: 
            - "IntegrationEvent" 
            - "DomainEvent" 

    ClassifiedCreatedEventData:
      type: object
      properties:
        classifiedId:
          type: string
    
    ClassifiedCensoredEventData:
      type: object
      properties:
        classifiedId:
          type: string
        censorshipReason:
          type: string
      required:
        - classifiedId
